spring:
  datasource:
    url: jdbc:h2:mem:wallet;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 20
  jackson:
    default-property-inclusion: NON_NULL
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 0
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: WARN
    com.kulu.sdet: INFO
