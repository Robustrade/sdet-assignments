# GitLab CI/CD pipeline for the Wallet Transfer test framework.
# Runs lint, schema validation, full pytest suite (parallel via xdist),
# a dedicated reliability stage, and uploads the HTML report as an artifact.

stages:
  - lint
  - schema
  - test
  - reliability

default:
  image: python:3.11-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install ruff black

variables:
  TEST_ENV: "qa"            # default env; override per-job for stg/prd pipelines
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

lint:
  stage: lint
  script:
    - ruff check .
    - black --check .

schema:
  stage: schema
  script:
    - python scripts/validate_schema.py

unit-and-integration-tests:
  stage: test
  script:
    - mkdir -p reports
    - pytest -n auto --excl_tests=reliability --html-report=reports/report.html -q
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 1 week

reliability-tests:
  stage: reliability
  script:
    - mkdir -p reports
    - pytest --incl_tests=reliability --html-report=reports/reliability.html -q
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 1 week
