# QA environment properties.
# Secrets are referenced as ${ENV_VAR} and resolved at load time from os.environ.
# Nothing here should ever contain a real credential.

env=qa
base_url=${WALLET_QA_BASE_URL:-http://localhost:5000}
db_url=${WALLET_QA_DB_URL:-:memory:}
api_user=${WALLET_QA_API_USER:-}
api_token=${WALLET_QA_API_TOKEN:-}
request_timeout_seconds=10
# Run the in-process Flask fixture (true) or hit a remote URL (false)?
use_inprocess_service=true
