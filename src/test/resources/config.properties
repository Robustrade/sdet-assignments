# =====================================================================
# Subscription Billing Test Suite — Configuration
# Override any value with a system property: -Dbase.url=http://...
# =====================================================================

# Target service base URL
base.url=http://localhost:8080

# HMAC-SHA256 secret used by the service to sign webhook events
webhook.secret=test-hmac-secret-key-256bit

# HTTP timeouts (ms)
connect.timeout.ms=5000
read.timeout.ms=10000

# Slack webhook URL — leave blank to run in no-op/logging mode
# slack.webhook.url=https://hooks.slack.com/services/XXX/YYY/ZZZ
slack.webhook.url=
